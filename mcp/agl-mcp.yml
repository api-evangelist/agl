agent_warnings:
- There is no idempotency key on any write. A retried request_reservation creates a second hold.
- Failures are returned inside an HTTP 200 envelope (status "fail"), so an agent must branch on the body,
  not the status code.
- confirm_reservation takes payment. The cancellation ladder returned by request_reservation (CancellationPolicy.policies[].appliesUntil)
  is the only reversal window and must be read before confirming.
