  api: ota
  schema: GolfClub / GolfClubDetail / GolfClubInformation / GolfClubInformationDetail
  key: id
  fields: [id, name, thumbnailImages, acceptedGroupSizes, currency, minPrice, minPriceDate,
    minPriceDateHour, timezone, category, lastUpdateAt]
  detail_fields: [checkpoints, cntHoles, par, courseLength, courseLengthUnit, telephone, address,
    homepageURL, latitude, longitude, googlePlaceId, courses, facilities]
  operations: [GET /v2/golfClubs, GET /v2/golfClub]
- name: GolfCourse
  api: ota
  schema: GolfCourse / CourseType / CourseTypeDetail
  key: id
  fields: [id, name, types]
  note: CourseTypeDetail is the per-hole card - holeName, par, handicap and the red/yellow/white/
    blue/black tee distances.
- name: TeeTime
