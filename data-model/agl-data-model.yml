summary: >-
  Two entity graphs describe the same business from opposite ends. The OTA (distribution) model is
  a catalogue-and-booking graph rooted on GolfClub and Reservation; the OPEN (supplier) model is a
  registration graph rooted on GolfClub and TeeTimeDailyInfo. They share the real-world entities -
  golf club, course, tee time, reservation - but not the field names or the identifier scheme:
  the distribution side keys on id / golfClubId / reservationId / reservationNumber, the supplier
  side keys on golfClubCode / courseCode / teeTimeCode / reservationId.
identifier_scheme:
  ota: >-
    Opaque string ids. GolfClub.id, StaticPackage.id, StaticPackagePlan.id, GolfCourse.id,
    TeeTime.id, Amount.reservationId. Reservation carries BOTH reservationId (one request) and
    reservationNumber ("integrated reservation number" - the group key that binds several requests
    made in one booking). Reference-code entities (Continent, Country, Region, City, Airport,
    GolfClubFacility) all use an id/name pair, and Country/Region/City carry a parent id.
  open: >-
    Partner-scoped codes rather than ids - golfClubCode, courseCode, teeTimeCode - plus the
    AGL-issued X-Supplier-Code and supplier-issued X-Client-Code as the tenancy keys carried in
    headers rather than in the payload.
  no_prefixes: >-
    Neither API publishes typed id prefixes (no cus_/res_ style discriminators), so an id is not
    self-describing.
