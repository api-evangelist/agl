aid: agl
name: AGL
description: 'AGL Inc. (에이지엘) is a Seoul-headquartered golf technology company, founded in 2019, that
  operates TIGER GDS — a global distribution system for golf. Its SaaS platform connects golf club tee-time
  inventory to travel and booking channels in real time, covering more than 1,000 contracted golf courses
  across 30+ countries, and is the system behind the HeyTeeTime/TIGERBOOKING consumer apps and the Reserve
  with Google golf integration. AGL publishes three machine-readable REST contracts on tigergds.com: the
  AGL OTA API (distribution — code lookups, golf club catalog, tee-time availability, static packages
  and the full reservation lifecycle), the AGL OPEN API (a bi-directional supplier bridge for golf-club
  and tee-time registration plus reservation callbacks) and a Trip.com outbound reservation integration.
  Offices in Seoul, Tokyo, Brea (CA) and Singapore.'
