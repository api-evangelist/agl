apis:
- aid: agl-ota
  name: AGL OTA API
  description: 'Distribution-side REST API of TIGER GDS. Version 2.0, OpenAPI 3.1.1, 24 operations across
    five capability groups: reference code lookups (languages, currencies, continents, countries, regions,
    cities, airports, facilities, package item codes), golf club catalog and detail, tee-time open dates
    and open tee times, static golf packages and plan inventory, and the reservation lifecycle (request,
    confirm, inquiry, partial cancel, cancel, voucher send). Authenticated with an Authorization header
    token plus a clientId header issued by AGL.'
  humanURL: https://api-doc.tigergds.com/reference
  baseURL: https://gw-ota.tigergds.com
  tags:
  - Tee Times
  - Reservations
  - Golf
  - Distribution
  - Travel
  properties:
  - type: OpenAPI
    url: openapi/agl-ota-openapi-original.yml
  - type: Documentation
    url: https://api-doc.tigergds.com/reference
  - type: APIReference
    url: https://api-doc.tigergds.com/reference
  image: https://www.aglgw.com/image/ko/img_main.png
- aid: agl-open
  name: AGL OPEN API
  description: 'Supplier-integration bridge API between AGL and golf-club suppliers. Version 0.0.1, OpenAPI
    3.1.1, 7 operations in two directions: Supplier to AGL (register a golf club, retrieve golf club information,
    change tee-time availability, daily tee-time registration, retrieve tee time list) and AGL to Supplier
    (reservation request, cancel reservation). Authenticated with a bearer Authorization header carrying
    an SHA-256 signature plus an X-Supplier-Code or X-Client-Code identification header.'
  humanURL: https://api-docs-agl-bridgeapi.tigergds.com/reference
  baseURL: https://agl-bridgeapi.tigergds.com
  tags:
  - Tee Times
  - Suppliers
  - Golf
  - Integration
  properties:
  - type: OpenAPI
    url: openapi/agl-open-openapi-original.yml
  - type: Documentation
    url: https://api-docs-agl-bridgeapi.tigergds.com/reference
  - type: APIReference
    url: https://api-docs-agl-bridgeapi.tigergds.com/reference
  image: https://www.aglgw.com/image/ko/img_main.png
- aid: agl-tripcom-outbound
  name: AGL Trip.com Reservation Integration API
  description: AGL-operated outbound reservation bridge that accepts Trip.com-format reservation messages.
    OpenAPI 3.0.1, a single POST /api/v1 operation carrying a signed request header (accountId, serviceName
    enum, requestTime, version, sign) and a free-form body, secured with a JWT bearer token plus ClientId,
    Currency and Language headers.
  humanURL: https://outboundapi-trip-reserv.tigergds.com/swagger/index.html
